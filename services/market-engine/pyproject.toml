[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-market"
version = "0.11.0"
description = "Primate Legends Pre-Market engine: $RYO ledger, card offers, airdrop rebalance and the activity feed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary, see LICENSE in the repository root" }
authors = [{ name = "Primate Legends" }]
dependencies = []

[project.urls]
Homepage = "https://primatelegends.world"
Repository = "https://github.com/PrimateLegends/Platform-and-Apps"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-cards"
version = "0.12.0"
description = "Primate Legends Battle Cards: the card catalog (PL-001..PL-205), KI stat budget, keyword vocabulary, deck rules and clan accents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary, see LICENSE in the repository root" }
authors = [{ name = "Primate Legends" }]
dependencies = []

[project.urls]
Homepage = "https://primatelegends.world"
Repository = "https://github.com/PrimateLegends/Platform-and-Apps"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primate_cards = ["catalog.json"]
